[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fah-eeg"
version = "0.1.0"
description = "Muse 2 EEG data collection and live visualization with BrainFlow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "brainflow>=5.22.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pyqtgraph>=0.13",
  "PyQt6>=6.6",
]

[project.scripts]
fah-record = "fah_eeg.record:main"
fah-spectrogram = "fah_eeg.viz_spectrogram:main"

[tool.setuptools.packages.find]
where = ["src"]
